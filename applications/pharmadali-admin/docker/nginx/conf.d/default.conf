server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes are handled by React Router client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache compiled Vite assets aggressively (they have hashed filenames)
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
