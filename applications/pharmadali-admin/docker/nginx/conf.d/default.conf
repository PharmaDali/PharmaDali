server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes are handled by React Router client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of index.html so updates and new hashed bundles take effect immediately on production
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Cache compiled Vite assets aggressively (they have hashed filenames)
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
