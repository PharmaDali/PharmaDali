server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Increase upload limit to match PHP settings
    client_max_body_size 100M;

    # Serve user-uploaded files directly from the storage volume,
    # bypassing the need for a public/storage symlink inside the nginx container.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri =404;
    }

    # All other requests: serve static files if present, otherwise
    # fall through to Laravel's front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to PHP-FPM running in the backend-app container.
    location ~ \.php$ {
        fastcgi_pass backend-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
