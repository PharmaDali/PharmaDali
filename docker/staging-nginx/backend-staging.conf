server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # STAGING ONLY: Tell Google and search engines never to index staging API responses
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Serve staging-only robots.txt directly
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    client_max_body_size 100M;

    # Serve user-uploaded files directly from the storage volume
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        log_not_found off;
        expires max;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # All other requests: serve static files if present, otherwise fall through to Laravel
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to PHP-FPM running in the staging-backend-app container
    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend staging-backend-app:9000;
        fastcgi_pass $upstream_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location ~ /\. {
        deny all;
    }
}
