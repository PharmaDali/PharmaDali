server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # STAGING ONLY: Tell Google and search engines never to index or archive staging
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Serve staging-only robots.txt directly
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # SPA fallback: unknown routes are handled by React Router client-side
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of index.html so updates and new hashed bundles take effect immediately
    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Cache compiled Vite assets aggressively (they have hashed filenames)
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}

